name: Qt 5 surface build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface:
    name: Build and test Gecko-stubbed surface
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5 build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes qt5-qmake qtbase5-dev

      - name: Build surface test
        run: |
          mkdir -p build/surface
          cd build/surface
          qmake "$GITHUB_WORKSPACE/tests/surface/surface.pro"
          make --jobs="$(nproc)"

      - name: Run surface test
        run: ./build/surface/tst_qmozsurface
